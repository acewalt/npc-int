name: Validate web demo

on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "index.html"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "*.js"
      - "index.html"
      - ".github/workflows/web-ci.yml"

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in ./*.js; do
            echo "Checking $file"
            node --check "$file"
          done
