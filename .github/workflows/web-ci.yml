name: Validate web demo

on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "tests/**"
      - "config/**"
      - "index.html"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "*.js"
      - "tests/**"
      - "config/**"
      - "index.html"
      - ".github/workflows/web-ci.yml"

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in ./*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Output safety smoke
        run: node tests/output-safety-smoke.js
      - name: Mental tuning config smoke
        run: node tests/tuning-config-smoke.js
      - name: Mental parity JS runner smoke
        shell: bash
        run: |
          set -euo pipefail
          node tests/mental-parity-js.js >/tmp/mental-parity-js.json
          node -e 'const x=require("/tmp/mental-parity-js.json"); if(!x.results || x.results.length<1) process.exit(1); console.log(`mental parity JS scenarios: ${x.results.length}`)'
      - name: Existing web cognition regression smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for file in ./tests/*.js; do
            case "$file" in
              ./tests/output-safety-smoke.js|./tests/tuning-config-smoke.js|./tests/mental-parity-js.js) continue ;;
            esac
            echo "Running $file"
            node "$file"
          done
