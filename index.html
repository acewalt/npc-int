<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#07100b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>npc-int // terminal</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="copy-chat.css" />
</head>
<body>
  <main class="terminal-shell" aria-label="Terminal NPC-INT">
    <header class="terminal-topbar">
      <div class="brand">
        <span class="brand-mark">NPC-INT</span>
        <span class="path">~/nia-01</span>
      </div>
      <div class="topbar-actions">
        <div class="status" title="Estado del agente">
          <span class="dot"></span>
          <span id="statusText">ONLINE · AUTO</span>
        </div>
        <button id="qwenToggle" class="qwen-toggle-button" type="button" aria-label="Activar Qwen3-0.6B" title="Activa Qwen3-0.6B. Si los pesos no están en caché, el navegador los descargará.">
          <span class="qwen-toggle-dot" aria-hidden="true"></span>
          <span id="qwenToggleLabel">ACTIVAR QWEN</span>
        </button>
        <button id="copyChat" class="copy-chat-button" type="button" aria-label="Copiar todo el chat" title="Copiar todo el contenido del chat">
          <span class="copy-chat-icon" aria-hidden="true">⧉</span>
          <span class="copy-chat-label">Copiar<span class="copy-chat-extra"> chat</span></span>
        </button>
      </div>
    </header>

    <section id="terminal" class="terminal" aria-live="polite" aria-label="Conversación"></section>

    <footer class="terminal-footer">
      <form id="chatForm" class="prompt-row" autocomplete="off">
        <span class="prompt-user">player@npc-int</span><span class="prompt-symbol">:$</span>
        <input id="input" type="text" spellcheck="false" autocomplete="off" autofocus
               placeholder="habla con el NPC o escribe /help" aria-label="Mensaje para el NPC" />
        <button type="submit" aria-label="Enviar">↵</button>
      </form>
      <div class="hint">/help · /companion · /relationship · /social-memory · /topics · /pending · /initiative · /personality · /timing · /modules · /pipeline · /trace · /refs · /safety · /tokenize · /nlp · /mind · /cognitive · /ideas · /plan · /neural · /event · /auto</div>
    </footer>
  </main>

  <script src="app.js"></script>
  <script src="companion-ui.js"></script>
  <script src="tokenizer.js"></script>
  <script src="tokenizer-refinement.js"></script>
  <script src="conversation.js"></script>
  <script src="pragmatics.js"></script>
  <script src="cognition.js"></script>
  <script src="discourse.js"></script>
  <script src="semantic-interpreter.js"></script>
  <script src="understanding.js"></script>
  <script src="self-model.js"></script>
  <script src="greetings.js"></script>
  <script src="grammar.js"></script>
  <script src="grammar-tokenizer-bridge.js"></script>
  <script src="wiki-packs.js"></script>
  <script src="knowledge.js"></script>
  <script src="local-wiki.js"></script>
  <script src="brain-pipeline.js"></script>
  <script src="mental-cycle.js"></script>
  <script src="cognitive-state.js"></script>
  <script src="concept-registry.js"></script>
  <script src="reference-resolver.js"></script>
  <script src="query-frame.js"></script>
  <script src="concept-graph.js"></script>
  <script src="hypothesis-engine.js"></script>
  <script src="idea-engine.js"></script>

  <script src="relationship-model.js"></script>
  <script src="social-memory.js"></script>
  <script src="personality-engine.js"></script>
  <script src="topic-manager.js"></script>
  <script src="pending-thread-manager.js"></script>
  <script src="social-timing.js"></script>
  <script src="initiative-engine.js"></script>
  <script src="companion-persistence.js"></script>

  <script src="dialogue-manager.js"></script>
  <script src="semantic-frame-bridge.js"></script>
  <script src="response-planner.js"></script>
  <script src="idea-response-bridge.js"></script>
  <script src="conversation-arbiter.js"></script>
  <script src="companion-engine.js"></script>
  <script src="companion-refinement.js"></script>
  <script src="nlp-web.js"></script>
  <script src="qwen-browser.js"></script>
  <script src="neural-web.js"></script>
  <script src="output-safety.js"></script>
  <script src="conversation-quality.js"></script>
  <script src="copy-chat.js"></script>
</body>
</html>
